<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل ملفات الموقع</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }
        input[type="url"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border 0.3s;
            direction: ltr;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .note {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            border-radius: 5px;
            font-size: 14px;
            color: #856404;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 تحميل ملفات الموقع</h1>
        <p class="subtitle">أدخل رابط الموقع وسيتم تحميل جميع ملفاته في ملف ZIP</p>

        <form action="/download" method="POST" onsubmit="startLoading()">
            <input type="url" name="url" placeholder="https://example.com" required>
            <button type="submit" id="btn">تحميل جميع الملفات</button>
            <div class="loader" id="loader">⏳ جاري التحميل، يرجى الانتظار...</div>
        </form>

        <div class="note">
            <strong>ملاحظة:</strong> قد يستغرق التحميل بعض الوقت حسب حجم الموقع.
        </div>
    </div>

    <script>
        function startLoading() {
            const btn = document.getElementById('btn');
            const loader = document.getElementById('loader');
            btn.disabled = true;
            btn.innerText = 'جاري التحميل...';
            loader.style.display = 'block';
        }
    </script>
</body>
</html>
